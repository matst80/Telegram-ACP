<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram-ACP WebSocket Test Client</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
            --user: #0ea5e9;
            --agent: #10b981;
            --event: #64748b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: var(--panel);
            padding: 1rem;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        input {
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            padding: 0.5rem;
            border-radius: 4px;
            flex-grow: 1;
        }
        button {
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        #status {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ef4444;
        }
        #status.connected { background: #10b981; }

        main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        #sidebar {
            width: 250px;
            border-right: 1px solid #334155;
            background: var(--panel);
            overflow-y: auto;
        }
        .thread-item {
            padding: 1rem;
            border-bottom: 1px solid #334155;
            cursor: pointer;
        }
        .thread-item:hover { background: #334155; }
        .thread-item.active { background: var(--accent); color: var(--bg); }

        #chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #020617;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message {
            max-width: 80%;
            padding: 0.75rem;
            border-radius: 8px;
            line-height: 1.5;
            position: relative;
        }
        .message.user {
            align-self: flex-end;
            background: var(--user);
            color: white;
        }
        .message.agent {
            align-self: flex-start;
            background: var(--panel);
            border: 1px solid #334155;
        }
        .message.event {
            align-self: center;
            background: transparent;
            color: var(--text-dim);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        pre {
            background: #000;
            padding: 0.5rem;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 0.85rem;
        }
        .meta {
            font-size: 0.7rem;
            margin-bottom: 0.25rem;
            opacity: 0.8;
        }
        #raw-log {
            height: 150px;
            background: #000;
            color: #10b981;
            font-family: monospace;
            padding: 0.5rem;
            overflow-y: auto;
            font-size: 0.75rem;
            border-top: 1px solid #334155;
        }
    </style>
</head>
<body>
    <header>
        <div id="status"></div>
        <input type="text" id="ws-url" value="ws://localhost:9001" placeholder="ws://localhost:9001">
        <button id="connect-btn">Connect</button>
    </header>
    <main>
        <div id="sidebar">
            <div style="padding: 0.5rem; font-size: 0.8rem; color: var(--text-dim);">THREADS</div>
            <div id="threads-list"></div>
        </div>
        <div id="chat-area">
            <div id="messages"></div>
            <div id="raw-log"></div>
        </div>
    </main>

    <script>
        let ws = null;
        let currentThread = null;
        const threads = new Map(); // thread_id -> messages[]

        const wsUrlInput = document.getElementById('ws-url');
        const connectBtn = document.getElementById('connect-btn');
        const statusDot = document.getElementById('status');
        const threadsList = document.getElementById('threads-list');
        const messagesContainer = document.getElementById('messages');
        const rawLog = document.getElementById('raw-log');

        function log(msg, type = 'info') {
            const entry = document.createElement('div');
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            rawLog.appendChild(entry);
            rawLog.scrollTop = rawLog.scrollHeight;
        }

        function connect() {
            if (ws) ws.close();
            
            const url = wsUrlInput.value;
            log(`Connecting to ${url}...`);
            ws = new WebSocket(url);

            ws.onopen = () => {
                statusDot.classList.add('connected');
                connectBtn.textContent = 'Disconnect';
                log('Connected');
            };

            ws.onclose = () => {
                statusDot.classList.remove('connected');
                connectBtn.textContent = 'Connect';
                log('Disconnected');
            };

            ws.onerror = (err) => {
                log('WebSocket Error', 'error');
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleEvent(data);
                } catch (e) {
                    log('Failed to parse message: ' + event.data, 'error');
                }
            };
        }

        function handleEvent(event) {
            const threadId = event.thread_id;
            if (!threads.has(threadId)) {
                threads.set(threadId, []);
                renderThreadsList();
            }

            threads.get(threadId).push(event);
            
            if (currentThread === threadId) {
                appendMessage(event);
            }
            
            log(`Event: ${event.type} (thread ${threadId})`);
        }

        function renderThreadsList() {
            threadsList.innerHTML = '';
            Array.from(threads.keys()).sort((a,b) => b-a).forEach(id => {
                const div = document.createElement('div');
                div.className = `thread-item ${id === currentThread ? 'active' : ''}`;
                div.textContent = `Topic #${id}`;
                div.onclick = () => switchThread(id);
                threadsList.appendChild(div);
            });
        }

        function switchThread(id) {
            currentThread = id;
            renderThreadsList();
            messagesContainer.innerHTML = '';
            (threads.get(id) || []).forEach(appendMessage);
        }

        function appendMessage(event) {
            const div = document.createElement('div');
            let content = '';

            switch (event.type) {
                case 'user_prompt':
                    div.className = 'message user';
                    content = `<div class="meta">User</div>${escapeHtml(event.text)}`;
                    break;
                case 'agent_update':
                    div.className = 'message agent';
                    const agentEvent = event.event;
                    if (agentEvent.type === 'working') {
                        content = `<i>Thinking...</i>`;
                    } else if (agentEvent.type === 'update') {
                        if (agentEvent.sessionUpdate === 'agent_message_chunk') {
                            content = `<div class="meta">Agent</div>${escapeHtml(agentEvent.content.text)}`;
                        } else if (agentEvent.sessionUpdate === 'tool_call') {
                            content = `<div class="meta">Tool Call</div><b>${escapeHtml(agentEvent.title)}</b>`;
                        } else if (agentEvent.sessionUpdate === 'plan') {
                            content = `<div class="meta">Plan Update</div><pre>${JSON.stringify(agentEvent.entries, null, 2)}</pre>`;
                        } else {
                            content = `<div class="meta">Update: ${agentEvent.sessionUpdate}</div>`;
                        }
                    } else if (agentEvent.type === 'finished') {
                        content = `<div class="meta">Done</div>${escapeHtml(agentEvent.content)}`;
                    } else if (agentEvent.type === 'error') {
                        content = `<div class="meta" style="color:#f87171">Error</div>${escapeHtml(agentEvent.content)}`;
                    }
                    break;
                case 'session_started':
                case 'session_switched':
                case 'session_ended':
                    div.className = 'message event';
                    content = `${event.type.replace('_', ' ')}: ${event.acp_session_id || ''}`;
                    break;
            }

            if (content) {
                div.innerHTML = content;
                messagesContainer.appendChild(div);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const p = document.createElement('p');
            p.textContent = text;
            return p.innerHTML;
        }

        connectBtn.onclick = () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
            } else {
                connect();
            }
        };
    </script>
</body>
</html>
